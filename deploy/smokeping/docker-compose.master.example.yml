services:
  smokeping:
    image: ${SMOKEPING_IMAGE:?set a validated image digest}
    container_name: smokeping
    hostname: smoke-master
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - ./config:/config
      - /srv/smokeping/data:/data
      # Install svc-apache-master.run as ./config/svc-apache/run (0755) first.
      - ./config/svc-apache/run:/etc/s6-overlay/s6-rc.d/svc-apache/run:ro
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
